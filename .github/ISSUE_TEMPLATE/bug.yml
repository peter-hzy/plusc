name: Bug 报告
description: 报告可复现的错误或数据不一致
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请只使用虚构或已脱敏数据复现。
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 实际发生了什么？预期是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 包含命令、脱敏输入和完整错误。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11 / Python 3.11 / PlusC 1.1.1
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除真实客户信息和凭据。
          required: true
